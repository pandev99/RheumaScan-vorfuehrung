<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>RheumaScan</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0E7C86">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="RheumaScan">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#EBF4F4; --surface:#FFFFFF; --sunk:#F3F8F8; --ink:#132527; --muted:#526B6D; --line:#CCE0E0;
  --accent:#0E7C86; --accent-ink:#FFFFFF; --accent-soft:#DAF1F1;
  --ok:#1D8049; --ok-soft:#E1F2E7; --warn:#A96A10; --warn-soft:#FBEFD9; --bad:#C0352B; --bad-soft:#FBE3E0;
  --unk:#5A6E70; --unk-soft:#E2ECEC;
  --pro:#0A5961; --pro-ink:#FFFFFF; --pro-soft:#D5ECEC;
  --display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0B1617; --surface:#132123; --sunk:#0E1A1B; --ink:#E2F0F0; --muted:#8DAAAC; --line:#233A3C;
    --accent:#5CCFD6; --accent-ink:#062326; --accent-soft:#113336;
    --ok:#52C386; --ok-soft:#14301F; --warn:#E6AE4A; --warn-soft:#342610; --bad:#F2705F; --bad-soft:#3A1916;
    --unk:#98ADAF; --unk-soft:#1D2D2F;
    --pro:#8FE3E6; --pro-ink:#062326; --pro-soft:#123033;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0B1617; --surface:#132123; --sunk:#0E1A1B; --ink:#E2F0F0; --muted:#8DAAAC; --line:#233A3C;
  --accent:#5CCFD6; --accent-ink:#062326; --accent-soft:#113336;
  --ok:#52C386; --ok-soft:#14301F; --warn:#E6AE4A; --warn-soft:#342610; --bad:#F2705F; --bad-soft:#3A1916;
  --unk:#98ADAF; --unk-soft:#1D2D2F;
    --pro:#8FE3E6; --pro-ink:#062326; --pro-soft:#123033;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ground)}
body{color:var(--ink);font:16px/1.5 var(--body);padding-inline:16px;padding-block:12px 40px}
.app{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

/* app bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:4px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:1.45rem;font-weight:700}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center}
.logo svg{display:block}
.profile{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 8px;font-size:.88rem;font-weight:700}
.profile .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}

/* scan panel */
.scan{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.label{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.code-row{display:flex;gap:8px}
.code-row input{flex:1;min-width:0;font-family:var(--mono);font-size:1.25rem;letter-spacing:.08em;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--sunk)}
.code-row input::placeholder{color:var(--muted);letter-spacing:.04em}
.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;min-height:48px}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:var(--sunk);border:1.5px solid var(--line)}
.btn:disabled{opacity:.55;cursor:default}
.scan-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.flare{display:flex;align-items:center;gap:10px;font-size:.95rem;cursor:pointer;user-select:none}
.flare input{width:22px;height:22px;accent-color:var(--bad)}
.note{font-size:.88rem;color:var(--muted);margin:0}
.msg{font-size:.92rem;padding:10px 12px;border-radius:10px;background:var(--unk-soft);margin:0}
video{width:100%;border-radius:10px;background:#000;aspect-ratio:4/3;object-fit:cover;max-width:100%}

/* result */
.result{background:var(--surface);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.verdict{display:flex;gap:14px;align-items:center;padding:14px 16px;background:var(--v-soft)}
.mark{flex:none;width:56px;height:56px;border-radius:50%;background:var(--v);display:grid;place-items:center;color:var(--surface)}
.mark svg{width:32px;height:32px}
.verdict h2{font-size:1.45rem;line-height:1.1;color:var(--v)}
.verdict .why{margin:4px 0 0;font-size:.95rem}
.v-green{--v:var(--ok);--v-soft:var(--ok-soft)}
.v-yellow{--v:var(--warn);--v-soft:var(--warn-soft)}
.v-red{--v:var(--bad);--v-soft:var(--bad-soft)}
.v-unknown{--v:var(--unk);--v-soft:var(--unk-soft)}
@media (prefers-reduced-motion: no-preference){ .mark{animation:pop .35s cubic-bezier(.3,1.6,.5,1)} @keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}} }
.product{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.product h3{font-size:1.1rem}
.product .brandname{color:var(--muted);font-size:.9rem}
.src{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.sect{padding:12px 16px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.sect:last-child{border-bottom:0}
.finding{display:grid;grid-template-columns:12px 1fr;gap:4px 12px}
.finding .sev{width:12px;height:12px;border-radius:50%;margin-top:6px}
.finding b{font-weight:700}
.finding p{margin:0;grid-column:2;font-size:.95rem}
.finding .where{grid-column:2;font-size:.82rem;color:var(--muted);font-family:var(--mono)}
.s-red{background:var(--bad)} .s-yellow{background:var(--warn)} .s-green{background:var(--ok)} .s-info{background:var(--unk)}
.ingr{margin:0;font-size:.95rem;line-height:1.7}
.ingr mark{background:none;color:inherit;border-radius:4px;padding:1px 3px;font-weight:700}
.ingr mark.m-red{background:var(--bad-soft);color:var(--bad);box-shadow:inset 0 -2px 0 var(--bad)}
.ingr mark.m-yellow{background:var(--warn-soft);color:var(--warn);box-shadow:inset 0 -2px 0 var(--warn)}
.ingr mark.m-info{background:var(--unk-soft);color:inherit;box-shadow:inset 0 -2px 0 var(--unk)}
.ingr mark.m-green{background:var(--ok-soft);color:var(--ok)}
.pos{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;margin:0}
.pos .plus{flex:none;width:20px;height:20px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-weight:700;font-size:.85rem;margin-top:2px}

/* examples, paste, recent */
.block{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-block:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;white-space:nowrap;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:.92rem;display:flex;align-items:center;gap:8px;min-height:40px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chip .sev{width:9px;height:9px;border-radius:50%}
details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
summary{padding:14px 16px;cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:48px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:1.3rem;color:var(--muted)}
details[open] summary::after{content:"–"}
.paste{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
textarea{width:100%;min-height:110px;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--sunk);resize:vertical}
.row2{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.num{display:flex;align-items:center;gap:6px;font-size:.9rem}
.num input{width:72px;padding:8px;border:1.5px solid var(--line);border-radius:8px;background:var(--sunk);font-family:var(--mono)}
.recent{display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.recent button{display:flex;align-items:center;gap:12px;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 16px;text-align:left;cursor:pointer;min-height:48px}
.recent button:last-child{border-bottom:0}
.recent .sev{width:10px;height:10px;border-radius:50%;flex:none}
.recent .more-row{justify-content:center;color:var(--accent);font-weight:700;gap:6px}
.recent .more-row svg{width:16px;height:16px}
.recent .code{margin-left:auto;font-family:var(--mono);font-size:.78rem;color:var(--muted)}
footer{font-size:.82rem;color:var(--muted);line-height:1.5}
footer p{margin:0 0 6px}

/* header buttons */
.bar-actions{display:flex;align-items:center;gap:8px}
.profile{cursor:pointer;color:var(--ink)}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.icon-btn svg{width:22px;height:22px}

/* scanner */
.btn-scan{display:flex;align-items:center;justify-content:center;gap:10px;flex:1;min-width:0;font-size:1.05rem;min-height:56px;padding-inline:12px;line-height:1.2;text-align:left;text-wrap:balance}
.scan-row{display:flex;gap:8px}
.photo-btn{flex:none;width:56px;min-height:56px;padding:0;display:grid;place-items:center}
.photo-btn svg{width:24px;height:24px}
.product .meta{font-size:.82rem;color:var(--muted)}
/* New, still incomplete product on Open Food Facts */
.notice{display:flex;gap:8px;align-items:flex-start;margin:8px 0 2px;padding:8px 10px;border-radius:10px;background:var(--sunk);border:1px solid var(--line);font-size:.85rem;line-height:1.4;color:var(--muted)}
.notice svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--accent)}
.notice .linkish{font-size:inherit;min-height:0;display:inline}
/* Problem ingredients at a glance */
details.probs{border:0;border-radius:0;background:none;border-bottom:1px solid var(--line)}
details.probs summary{padding:10px 16px;min-height:48px;gap:10px;justify-content:flex-start;font-size:.98rem}
details.probs summary .pt{flex:1}
details.probs summary .sev{width:10px;height:10px;border-radius:50%;flex:none}
details.probs summary::after{content:"";flex:none;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-top:-4px;transition:transform .15s}
details.probs[open] summary::after{content:"";transform:rotate(-135deg);margin-top:4px}
.plist{list-style:none;margin:0;padding:0 16px 4px;display:flex;flex-direction:column}
.plist li{display:grid;grid-template-columns:10px 1fr;gap:2px 12px;padding:9px 0;border-top:1px solid var(--line)}
.plist li:first-child{border-top:0;padding-top:2px}
.plist .sev{width:10px;height:10px;border-radius:50%;margin-top:6px}
.plist b{display:block;font-weight:700;overflow-wrap:anywhere}
.plist small{display:block;color:var(--muted);font-size:.85rem;margin-top:1px}
details.probs > .linkish{margin:2px 16px 12px;font-size:.9rem}
/* "Scan next" button after a result */
.next-scan{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom, 0px));z-index:30;display:flex;align-items:center;gap:10px;
  min-height:54px;padding:0 24px;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;font-size:1.02rem;cursor:pointer;
  box-shadow:0 6px 20px rgba(6,40,44,.28),0 1px 3px rgba(0,0,0,.15);white-space:nowrap}
.next-scan svg{width:22px;height:22px;flex:none}
.next-scan[hidden]{display:none}
.app.fab-on{padding-bottom:96px}
/* compact summary + collapsible details */
.gist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.vtext{min-width:0}
.verdict .pill{background:var(--surface);border-color:transparent}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;font-weight:700;border-radius:12px;line-height:1.25;padding:4px 10px;background:var(--sunk);border:1px solid var(--line)}
.pill .sev{width:8px;height:8px;border-radius:50%}
.pill.note{font-weight:600;color:var(--muted)}
.pill.plus{color:var(--ok);background:var(--ok-soft);border-color:transparent}
details.more{border:0;border-radius:0;background:none;border-bottom:1px solid var(--line)}
details.more summary{padding:10px 16px;font-size:.95rem;color:var(--accent);min-height:44px}
details.more summary::after{content:"";width:9px;height:9px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-top:-4px;transition:transform .15s}
details.more[open] summary::after{content:"";transform:rotate(-135deg);margin-top:4px}
details.more .sect{border-bottom:0;border-top:1px solid var(--line)}
.btn-scan svg{width:24px;height:24px;flex:none}
.scan-sub{display:flex;gap:8px;flex-wrap:wrap}
.scan-sub .btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-width:0}
.scan-sub svg{width:20px;height:20px;flex:none}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.85rem}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.viewer{position:relative;border-radius:12px;overflow:hidden;background:#000}
#reader{width:100%;min-height:200px}
#reader video{border-radius:0;aspect-ratio:auto;display:block;width:100%!important;height:auto}
#nativeVideo{display:block}
.viewer-hint{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;font-size:.9rem;text-align:center}
.native-frame{position:absolute;left:8%;right:8%;top:32%;bottom:32%;border:3px solid #fff;border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.native-frame::after{content:"";position:absolute;left:4%;right:4%;top:50%;height:2px;background:#ff5a4a}
@media (prefers-reduced-motion: no-preference){ .native-frame::after{animation:sweep 1.6s ease-in-out infinite alternate} @keyframes sweep{from{top:12%}to{top:88%}} }
.profile-row{display:flex;align-items:center;gap:6px;border:0;background:none;padding:0;font-size:.9rem;color:var(--muted);cursor:pointer;min-height:32px;text-align:left}
.profile-row b{color:var(--ink)}
.profile-row .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.profile-row .chev{color:var(--accent);font-size:1.2rem;line-height:1}
@media (max-width:380px){ #proBadge{display:none!important} }
.flare-on .flare{color:var(--bad);font-weight:700}

/* options sheet */
dialog.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:520px;max-height:92vh;border-radius:20px 20px 0 0;background:var(--surface);color:var(--ink)}
@media (min-width:600px){ dialog.sheet{margin:auto;border-radius:20px} }
dialog.sheet::backdrop{background:rgba(6,24,26,.5)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px;position:sticky;top:0;background:var(--surface);z-index:1}
.sheet-head h2{font-size:1.35rem}
.sheet-body{padding:4px 18px calc(24px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:22px}
.opt{display:flex;flex-direction:column;gap:10px}
.seg{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:10px 8px;font-weight:700;cursor:pointer;min-height:44px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.conds{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cond{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);min-height:52px}
.cond:last-child{border-bottom:0}
.cond input{flex:none;width:20px;height:20px;accent-color:var(--accent)}
.cond.off{color:var(--muted)}
.cond .soon{margin-left:auto;font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;cursor:pointer}
.switch-row small{display:block;color:var(--muted);font-size:.85rem}
.switch{appearance:none;-webkit-appearance:none;flex:none;width:52px;height:32px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.switch:checked{background:var(--accent)}
.switch:checked::after{left:23px}
.danger{color:var(--bad)}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#medsList{display:flex;flex-direction:column;gap:12px}
/* premium */
.pro{font-family:var(--display);font-size:.72rem;font-weight:700;letter-spacing:.08em;padding:3px 8px;border-radius:999px;background:var(--pro);color:var(--pro-ink)}
.alt-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.alt-row{display:grid;grid-template-columns:12px 1fr auto;gap:2px 12px;align-items:center;padding:12px 14px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer;min-height:56px;width:100%}
.alt-row:last-child{border-bottom:0}
.alt-row .sev{width:12px;height:12px;border-radius:50%}
.alt-row b{font-weight:700}
.alt-row small{grid-column:2;color:var(--muted);font-size:.85rem}
.alt-row .go{grid-row:1 / span 2;grid-column:3;color:var(--muted);font-size:1.2rem}
.locked{position:relative}
.skel{display:grid;grid-template-columns:12px 1fr;gap:6px 12px;align-items:center;padding:14px;border-bottom:1px solid var(--line)}
.skel:last-child{border-bottom:0}
.skel i{display:block;height:10px;border-radius:6px;background:var(--line)}
.skel i.dot{width:12px;height:12px;border-radius:50%;background:var(--ok);opacity:.5}
.skel i.w2{grid-column:2;width:55%;height:8px;opacity:.7}
.check-row .meta{font-size:.82rem;color:var(--muted)}
.empty{display:flex;gap:14px;align-items:center;padding:16px;color:var(--muted);font-size:.95rem}
.empty svg{flex:none;width:36px;height:36px;color:var(--accent)}
.empty p{margin:0}
/* premium features */
.act-row{padding:0 16px 12px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.btn-sm{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.88rem;cursor:pointer;min-height:36px;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.btn-sm.done{border-color:var(--ok);color:var(--ok)}
.btn-sm svg{width:16px;height:16px}
.lock-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.9rem;color:var(--muted)}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.toggles .chip{min-height:40px}
.trig{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.trig-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 8px 8px 14px;border-bottom:1px solid var(--line);min-height:52px}
.trig-row:last-child{border-bottom:0}
.trig-row > span:first-child{flex:1;min-width:0;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
.trig-row select{flex:none;width:48%}
.trig-row > span:last-child:not(:first-child){display:flex;align-items:center;gap:4px;flex:none;width:58%}
.trig-row > span:last-child select{width:auto;flex:1;min-width:0}
.trig-row select,.add-row select{font:inherit;padding:8px;border-radius:8px;border:1.5px solid var(--line);background:var(--sunk);color:var(--ink);min-height:40px}
.trig-row button{border:0;background:none;font-size:1.3rem;color:var(--muted);cursor:pointer;min-width:40px;min-height:40px}
.add-row{display:flex;gap:8px}
.add-row input{flex:1;min-width:0;padding:10px;border:1.5px solid var(--line);border-radius:8px;background:var(--sunk)}
.tabs{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.tabs button{flex:1;border:0;background:none;border-radius:9px;padding:10px 6px;font-weight:700;cursor:pointer;min-height:44px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pain{display:flex;flex-direction:column;gap:8px}
.pain-head{display:flex;justify-content:space-between;align-items:baseline}
.pain-val{font-family:var(--display);font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums}
.pain input[type=range]{width:100%;accent-color:var(--accent);height:32px}
.pain .scale{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.field input,.field textarea{padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--sunk);font:inherit;color:inherit}
.field textarea{min-height:70px}
.eaten{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.eaten div{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-bottom:1px solid var(--line);font-size:.92rem;min-height:48px}
.eaten div:last-child{border-bottom:0}
.eaten .sev{width:10px;height:10px;border-radius:50%;flex:none}
.eaten span.n{flex:1;min-width:0}
.eaten button{border:0;background:none;font-size:1.2rem;color:var(--muted);cursor:pointer;min-width:40px;min-height:40px}
.chart{width:100%;height:auto;display:block;touch-action:manipulation}
.chart text{font-family:var(--body);font-size:9px;fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--accent)}
.chart .bar.sel{fill:var(--ink)}
.chart .nodata{fill:var(--line)}
.chart .flare{fill:var(--bad);stroke:var(--surface);stroke-width:2}
.chart .hit{fill:transparent;cursor:pointer}
.legend{display:flex;gap:14px;font-size:.82rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--accent);margin-right:6px;vertical-align:-1px}
.legend i.f{border-radius:50%;background:var(--bad)}
.legend i.n{background:var(--line)}
.tip{font-size:.9rem;min-height:1.4em;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font-family:var(--display);font-size:1.35rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted)}
.countlist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.countlist li{display:flex;justify-content:space-between;gap:10px}
.countlist b{font-variant-numeric:tabular-nums}
.report{font-size:.92rem;display:flex;flex-direction:column;gap:6px}
.report h3{font-size:1rem;margin:6px 0 0}
.report p{margin:0}
.report table{width:100%;border-collapse:collapse;font-size:.88rem}
.report td,.report th{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.report th{font-weight:700;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em}
.report .tbl{overflow-x:auto}
#printArea{display:none}
@media print{
  .app, dialog, footer{display:none!important}
  #printArea{display:block;color:#000;background:#fff;font:12pt/1.45 var(--body);padding:0}
  #printArea .report td,#printArea .report th{border-color:#bbb}
}
.btn-danger{background:var(--bad);color:var(--surface)}
.confirm-box{display:flex;flex-direction:column;gap:10px;border:1.5px solid var(--bad);background:var(--bad-soft);border-radius:12px;padding:12px 14px}
.confirm-box p{margin:0;font-size:.92rem}
.seg-grid{display:grid;grid-template-columns:1fr 1fr}
@media (max-width:350px){
  .brand{gap:8px} .brand h1{font-size:1.2rem} .logo{width:30px;height:30px}
  .bar-actions{gap:6px} .icon-btn{width:40px;height:40px}
}
.ios-guide{display:flex;flex-direction:column;gap:8px;background:var(--accent-soft);border-radius:var(--r);padding:14px 16px;font-size:.93rem}
.ios-guide ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px}
.ios-guide .share-ic{width:18px;height:18px;vertical-align:-3px;color:var(--accent)}
.ios-guide .btn{align-self:flex-start;min-height:40px;padding:8px 14px}
/* installed app: keep clear of notch and home indicator */
html.pwa body{padding-top:max(12px, env(safe-area-inset-top, 0px));padding-bottom:max(40px, env(safe-area-inset-bottom, 0px));padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.install{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-size:.92rem}
.install .btn{flex:none;min-height:44px;padding:10px 14px}
/* personal and showcase builds: no Premium anywhere */
.showcase #paywall{display:none!important}
.personal .pro, .personal #proSection, .personal #proBadge, .personal .cond.off{display:none!important}
.lite #diaryBtn, .lite #ateBtn, .lite .premium-only, .lite #proSection, .lite #proBadge, .lite .pro, .lite #paywall, .lite #diary{display:none!important}
.ocr-btn{display:flex;align-items:center;justify-content:center;gap:8px}
.ocr-btn svg{width:22px;height:22px}
.base-chip{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.9rem;background:var(--accent-soft);border-radius:10px;padding:8px 8px 8px 12px}
.base-chip button{border:0;background:none;font-size:1.2rem;line-height:1;cursor:pointer;color:var(--muted);min-width:36px;min-height:36px}
.linkish{background:none;border:0;padding:0;color:var(--accent);font-weight:700;cursor:pointer;text-align:left;font-size:.88rem;text-decoration:underline;text-underline-offset:3px}
/* Missing ingredient list: the photo is the obvious next step */
.fill{margin:0 16px 14px;padding:14px;border-radius:var(--r);background:var(--accent-soft);display:flex;flex-direction:column;gap:10px}
.fill p{margin:0;font-size:.95rem}
.fill .linkish{align-self:center;font-size:.92rem;min-height:36px}
/* Sending a list to Open Food Facts */
.contrib{margin:0 16px 14px;padding:14px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--sunk);display:flex;flex-direction:column;gap:10px}
.contrib p{margin:0}
.contrib h4{margin:0;font:700 1rem/1.3 var(--display)}
.ctext{margin:0;padding:8px 10px;border-left:3px solid var(--accent);background:var(--surface);border-radius:6px;font-size:.88rem;max-height:7.5em;overflow:auto;overflow-wrap:anywhere;user-select:text}
.crow{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:.92rem}
.crow select{font:inherit;padding:6px 8px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);min-height:40px;margin-left:6px}
.cbtns{display:flex;flex-wrap:wrap;gap:8px}
.cbtns .btn{flex:1 1 auto}
.login{display:grid;gap:8px}
.login input{min-width:0}
.contrib .ok{color:var(--ok);font-weight:700}
.contrib .chk input{accent-color:var(--accent)}
/* Optional settings tucked away in one quiet row */
details.fold{background:none;border:1px solid var(--line);border-radius:12px}
details.fold summary{padding:10px 14px;min-height:52px;font-weight:600;gap:12px}
details.fold summary small{display:block;color:var(--muted);font-size:.85rem;font-weight:400}
details.fold summary::after{content:"";flex:none;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-top:-4px;transition:transform .15s}
details.fold[open] summary::after{content:"";transform:rotate(-135deg);margin-top:4px}
details.fold .off-box{padding:0 14px 14px}
.off-box{display:flex;flex-direction:column;gap:10px}
.off-box form{display:flex;flex-direction:column;gap:10px}
.check-row{padding:0 16px 12px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.progress{height:6px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
textarea.review{border-color:var(--warn)}
.unlock-row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:.92rem}
.unlock-row .btn{flex:none;min-height:44px;padding:10px 14px}
.unlock{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.unlock p{margin:0;font-size:.95rem}
.btn-pro{background:var(--pro);color:var(--pro-ink);display:inline-flex;align-items:center;gap:8px}
.btn-pro svg{width:18px;height:18px}
.pw-hero{display:flex;flex-direction:column;gap:6px}
.pw-hero h2{font-size:1.6rem}
.pw-hero p{margin:0;color:var(--muted)}
.feat{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.feat li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start}
.feat .tick{width:22px;height:22px;border-radius:50%;background:var(--pro-soft);color:var(--pro);display:grid;place-items:center;font-weight:700;font-size:.8rem}
.feat small{display:block;color:var(--muted);font-size:.85rem}
.tag{font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:2px 8px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.new{background:var(--pro-soft);color:var(--pro);border-color:transparent}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plan{border:2px solid var(--line);border-radius:14px;padding:14px;background:var(--surface);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;position:relative}
.plan[aria-pressed="true"]{border-color:var(--pro);background:var(--pro-soft)}
.plan .price{font-family:var(--display);font-size:1.3rem;font-weight:700}
.plan small{color:var(--muted);font-size:.82rem}
.plan .save{position:absolute;top:-10px;right:10px;background:var(--pro);color:var(--pro-ink);font-size:.7rem;font-weight:700;border-radius:999px;padding:2px 8px}
.free-box{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:.9rem}
.free-box b{display:block;margin-bottom:4px}
.fine{font-size:.8rem;color:var(--muted);margin:0;text-align:center}
.pro-status{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.about{font-size:.9rem;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.about p{margin:0}
</style>

</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 20 20"><rect x="2" y="3" width="2" height="14" fill="var(--accent-ink)"/><rect x="6" y="3" width="1" height="14" fill="var(--accent-ink)"/><rect x="9" y="3" width="3" height="14" fill="var(--accent-ink)"/><rect x="14" y="3" width="1" height="14" fill="var(--accent-ink)"/><rect x="16.5" y="3" width="1.5" height="14" fill="var(--accent-ink)"/></svg>
      </div>
      <h1>RheumaScan</h1>
      <span class="pro" id="proBadge" hidden>PRO</span>
    </div>
    <div class="bar-actions">
      <button class="icon-btn" type="button" id="diaryBtn" data-t-aria="diary" data-t-title="diary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z"/><path d="M5 17a3 3 0 0 1 3-3h11"/><path d="M9 8h6"/></svg>
      </button>
      <button class="icon-btn" type="button" id="menuBtn" data-t-aria="openMenu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </div>
  </header>

  <div class="ios-guide" id="iosGuide" hidden>
    <b data-t="iosTitle"></b>
    <ol>
      <li><span data-t="iosStep1a"></span> <svg class="share-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="↑"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg> <span data-t="iosStep1b"></span></li>
      <li data-t="iosStep2"></li>
      <li data-t="iosStep3"></li>
    </ol>
    <p class="note" data-t="iosNote"></p>
    <button type="button" class="btn btn-ghost" id="iosGuideOk" data-t="iosOk"></button>
  </div>

  <section class="scan" id="scanPanel">
    <button class="profile-row" type="button" id="profileBtn"><span class="dot"></span><span class="pr-label" data-t="ratedAs"></span> <b id="profileName"></b><span class="chev" aria-hidden="true">›</span></button>
    <div class="scan-row">
      <button class="btn btn-primary btn-scan" type="button" id="camBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M13 8v8M16.5 8v8"/></svg>
      <span id="camLabel" data-t="scan"></span>
    </button>
      <label class="btn btn-ghost photo-btn" for="photoInput" data-t-aria="photo" data-t-title="photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M8 6l1.5-2h5L16 6"/><circle cx="12" cy="13" r="3.5"/></svg>
      </label>
      <input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
    </div>
    <div class="viewer" id="viewer" hidden>
      <div id="reader"></div>
      <video id="nativeVideo" playsinline muted hidden></video>
      <div class="native-frame" id="nativeFrame" hidden></div>
      <div class="viewer-hint" data-t="scanHint"></div>
    </div>
    <div class="divider" data-t="orType"></div>
    <form class="code-row" id="codeForm" autocomplete="off">
      <input id="code" inputmode="numeric" maxlength="14" data-t-ph="placeholder" data-t-aria="codeLabel" aria-describedby="scanMsg">
      <button class="btn btn-primary" type="submit" id="checkBtn" data-t="check"></button>
    </form>
    <label class="flare"><input type="checkbox" id="flare"> <span data-t="flare"></span></label>
    <p class="msg" id="scanMsg" role="status" hidden></p>
    <div id="fileReader" hidden></div>
  </section>

  <section class="result" id="result" aria-live="polite"></section>

  <details id="pasteBox">
    <summary data-t="pasteSummary"></summary>
    <form class="paste" id="pasteForm">
      <div class="base-chip" id="pasteBase" hidden></div>
      <label class="btn btn-ghost ocr-btn" for="ingrPhoto">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2"/><path d="M8 9h8M8 12h8M8 15h5"/></svg>
        <span data-t="ocrBtn"></span>
      </label>
      <input type="file" id="ingrPhoto" accept="image/*" capture="environment" hidden>
      <p class="msg" id="ocrStatus" role="status" hidden></p>
      <textarea id="pasteText" data-t-aria="pasteAria" data-t-ph="pastePh"></textarea>
      <div class="row2">
        <label class="flare"><input type="checkbox" id="pasteDrink"> <span data-t="isDrink"></span></label>
        <label class="num"><span data-t="sugar"></span> <input id="pasteSugar" inputmode="decimal" placeholder="g"> /100</label>
        <label class="num"><span data-t="alcohol"></span> <input id="pasteAlc" inputmode="decimal" placeholder="%"> vol</label>
        <label class="num"><span data-t="saltLabel"></span> <input id="pasteSalt" inputmode="decimal" placeholder="g"> /100</label>
      </div>
      <button class="btn btn-primary" type="submit" data-t="pasteBtn"></button>
    </form>
  </details>

  <section class="block" id="recentWrap" hidden>
    <span class="label" data-t="recent"></span>
    <div class="recent" id="recent"></div>
  </section>

  <div class="install" id="installBox" hidden>
    <span data-t="installText"></span>
    <button type="button" class="btn btn-primary" id="installBtn" data-t="installBtn"></button>
  </div>

  <footer>
    <p id="personalNote" hidden data-t="personalNote"></p>
    <p data-t="disclaimer"></p>
    <p data-t="dataSource"></p>
  </footer>
  <button type="button" class="next-scan" id="nextScan" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M13 8v8M16.5 8v8"/></svg>
    <span data-t="nextScan"></span>
  </button>
</div>

<dialog class="sheet" id="menu" aria-labelledby="menuTitle">
  <div class="sheet-head">
    <h2 id="menuTitle" data-t="menuTitle"></h2>
    <button class="btn btn-ghost" type="button" id="menuClose" data-t="done"></button>
  </div>
  <div class="sheet-body">
    <div class="opt" id="proSection">
      <span class="label">Premium</span>
      <div class="pro-status" id="proStatus"></div>
    </div>
    <div class="opt">
      <span class="label" data-t="optLang"></span>
      <div class="seg seg-grid" id="langSeg">
        <button type="button" data-lang="de">Deutsch</button>
        <button type="button" data-lang="en">English</button>
        <button type="button" data-lang="nl">Nederlands</button>
        <button type="button" data-lang="fr">Français</button>
      </div>
    </div>
    <div class="opt">
      <span class="label" data-t="optCond"></span>
      <div class="conds" id="conds"></div>
    </div>
    <div class="opt premium-only" id="extraWrap">
      <span class="label"><span data-t="optExtra"></span> <span class="pro">PRO</span></span>
      <div id="extraConds"></div>
    </div>
    <div class="opt premium-only" id="triggerWrap">
      <span class="label"><span data-t="optTriggers"></span> <span class="pro">PRO</span></span>
      <div id="triggerBox"></div>
    </div>
    <div class="opt" id="medsWrap" hidden>
      <span class="label" data-t="optMeds"></span>
      <div id="medsList"></div>
      <p class="note" data-t="medsNote"></p>
    </div>
    <div class="opt">
      <span class="label" data-t="optTheme"></span>
      <div class="seg" id="themeSeg">
        <button type="button" data-theme-opt="system" data-t="themeSystem"></button>
        <button type="button" data-theme-opt="light" data-t="themeLight"></button>
        <button type="button" data-theme-opt="dark" data-t="themeDark"></button>
      </div>
    </div>
    <div class="opt">
      <span class="label" data-t="optScan"></span>
      <label class="switch-row" for="optVibrate" id="vibrateRow"><span><span data-t="vibrate"></span><small data-t="vibrateSub"></small></span><input type="checkbox" class="switch" id="optVibrate"></label>
      <label class="switch-row" for="optAuto"><span><span data-t="autoCheck"></span><small data-t="autoCheckSub"></small></span><input type="checkbox" class="switch" id="optAuto"></label>
      <label class="switch-row" for="optProbs"><span><span data-t="probOpt"></span><small data-t="probOptSub"></small></span><input type="checkbox" class="switch" id="optProbs"></label>
    </div>
    <div class="opt">
      <span class="label" data-t="optHistory"></span>
      <div class="confirm" id="clearWrap">
        <button type="button" class="btn btn-ghost danger" id="clearBtn" data-t="clear"></button>
      </div>
      <div class="confirm" id="clearConfirm" hidden>
        <span data-t="clearSure"></span>
        <button type="button" class="btn btn-danger" id="clearYes" data-t="clearYes"></button>
        <button type="button" class="btn btn-ghost" id="clearNo" data-t="cancel"></button>
      </div>
    </div>
    <details class="fold" id="offWrap">
      <summary><span><span data-t="optOff"></span><small id="offState"></small></span></summary>
      <div class="off-box" id="offAcctBox"></div>
    </details>
    <div class="opt">
      <span class="label" data-t="optAbout"></span>
      <div class="about"><p id="rulesInfo"></p><p data-t="disclaimer"></p><p data-t="dataSource"></p></div>
    </div>

<script>
/* RheumaScan rules engine v0.4
 * Pure function: evaluate(product, rules, options) -> result.
 * No network, no UI. Ports directly to Dart/Kotlin/Swift for the phone app.
 *
 * product = {
 *   name, brand,
 *   ingredientsText,           // raw ingredient list as printed
 *   categories: ["en:beers"],  // Open Food Facts category tags
 *   nutriments: { alcohol, sugars },  // per 100 g / 100 ml
 *   isBeverage: bool
 * }

(function (root) {
  "use strict";

  var PCT = /(\d+(?:[.,]\d+)?)\s*%(?!\s*vol)/gi;           // "11 % vol" is alcohol strength, not a share
  var AT_LEAST = /(\bmind\.?|\bmindestens|\bmin\.|\bminimum|\bat least|\bten minste|\bminstens|\bminimaal|\bau moins)\s*$/i;
  // Additive class names ("Stabilisator: E340") are not components; "Sauce:" or "Klopse (40 %):" are.
  var ADDITIVE_CLASS = /(mittel|stoff|stof|stabili|emulg|regulator|regelaar|verstärker|salz|agent|thicken|acid|antioxid|preserv|colou?r|sweeten|enhancer|humectant|middel|zuur|émulsifiant|épaississant|conservateur|édulcorant|exhausteur|gélifiant|antiagglomérant|lever)/;

  function firstShare(s) {

  }
  // The ingredient's own share: "Rum 5 %" or a bracket holding only the share, "Kapern (1 %)".
  // Percentages of sub-ingredients ("Schokolade (Kakao 30 %)") say nothing about the ingredient itself.
  function ownShare(seg) {

      else if (depth === 0) top += ch; else cur += ch;

    // otherwise the leftover "vin blanc" would count as wine.

        if (c.indexOf(ts[j]) !== -1) return { position: i + 1, term: terms[j], ingredient: ingredients[i] };
      }

        var w = wordNorm(ingredients[i]);
        wex.forEach(function (e) { w = w.split(e).join(" | "); });
        for (var k = 0; k < ws.length; k++) {

        }
      }

    return null;
  }

  // "159 g de viande mis en œuvre pour 100 g de produit fini", "Für 100 g Salami wurden 145 g Fleisch verwendet".
  // Only a big loss means dried; roast chicken or cooked sausages state 100–115 g.
  var DRY_RES = [
    /(\d{2,3})\s*g\b[^.;]{0,80}?(?:mis\s+en\s+(?:oe|œ)uvre|utilis[ée]e?s|used|verwendet|gebruikt)\s+(?:pour|for|to\s+(?:make|obtain|produce)|für|voor)\s+(?:obtenir\s+)?100\s*g/g,
    /(?:pour|for|für|voor|zur\s+herstellung\s+von)\s+100\s*g\b[^.;]{0,80}?\b(\d{2,3})\s*g\b/g,
    /(?:aus|from|van)\s+(\d{2,3})\s*g\b[^.;]{0,60}?(?:je|pro|per|für)\s+100\s*g/g
  ];
  function dryWeightHit(ingredients, dw, pname) {
    if (dw.unlessName && dw.unlessName.some(function (t) { return compact(pname).indexOf(compact(t)) !== -1; })) return null;
    for (var i = 0; i < ingredients.length; i++) {
      var s = String(ingredients[i]).toLowerCase(), g = 0, m;

    both: { de: "Salz- und Zuckergehalt konnten nicht geprüft werden, weil die Nährwerte fehlen. Schau auf die Packung.", en: "Salt and sugar content could not be checked because the nutrition facts are missing. Check the pack.", nl: "Zout- en suikergehalte konden niet worden gecontroleerd, omdat de voedingswaarden ontbreken. Kijk op de verpakking.", fr: "Les teneurs en sel et en sucre n’ont pas pu être vérifiées, car les valeurs nutritionnelles manquent. Regardez l’emballage." }

  "basis": {
    "de": "Für GPA gibt es keine eigene Diät. Die Regeln richten sich nach typischen Folgen der Behandlung und nach einer möglichen Nierenbeteiligung: BfR-Hinweise zur Lebensmittelsicherheit für abwehrgeschwächte Menschen, Empfehlungen zu Salz, Zucker und Knochengesundheit unter Kortison, Hinweise zu Alkohol unter Methotrexat sowie KDIGO-Hinweise zu Salz, Phosphat und Kalium bei Nierenerkrankung. Einschränkungen bei eingeschränkter Nierenfunktion immer mit der Nephrologie abstimmen. Noch nicht ärztlich geprüft.",
    "en": "There is no specific GPA diet. The rules follow typical effects of treatment and possible kidney involvement: German BfR food-safety advice for immunocompromised people, salt, sugar and bone-health advice under glucocorticoids, alcohol guidance on methotrexate, and KDIGO advice on salt, phosphate and potassium in kidney disease. Always agree kidney-related restrictions with your nephrologist. Not yet reviewed by a clinician.",
    "nl": "Er bestaat geen speciaal GPA-dieet. De regels volgen typische gevolgen van de behandeling en een mogelijke nierbetrokkenheid: adviezen van het Duitse BfR over voedselveiligheid bij verminderde afweer, adviezen over zout, suiker en botgezondheid bij corticosteroïden, adviezen over alcohol bij methotrexaat en KDIGO-adviezen over zout, fosfaat en kalium bij nierziekte. Stem beperkingen bij verminderde nierfunctie altijd af met je nefroloog. Nog niet medisch beoordeeld.",
    "fr": "Il n’existe pas de régime spécifique à la GPA. Les règles suivent les effets habituels du traitement et une éventuelle atteinte rénale : conseils du BfR allemand sur la sécurité alimentaire des personnes immunodéprimées, conseils sur le sel, le sucre et la santé osseuse sous corticoïdes, conseils sur l’alcool sous méthotrexate et recommandations KDIGO sur le sel, le phosphate et le potassium en cas de maladie rénale. Convenez toujours des restrictions liées aux reins avec votre néphrologue. Pas encore relu par un médecin."
  },

var OFF_WRITE = "https://world.openfoodfacts.org";

var LANG_MARKS = {
  de: ["und","zucker","salz","wasser","milch","enthält","gewürze","säuerungsmittel","speisesalz","weizenmehl","hefeextrakt","emulgator","pflanzliches","pflanzliche","rapsöl","sonnenblumenöl","stärke","aroma","aromen","glukosesirup","vollmilchpulver","mit"],

  en: ["and","sugar","salt","water","milk","contains","spices","flour","wheat","acidity","regulator","yeast","extract","emulsifier","vegetable","oil","rapeseed","sunflower","starch","flavouring","flavourings","flavoring","of","syrup","with"]

function guessLang(text){
  var words = String(text || "").toLowerCase().split(/[^a-zäöüßéèàâêëîïôûùÿçœ]+/), counts = {}, max = 0, best = null;
  Object.keys(LANG_MARKS).forEach(function(l){
    var m = LANG_MARKS[l], n = 0;
    for (var i = 0; i < words.length && i < 150; i++) if (m.indexOf(words[i]) !== -1) n++;

    var s = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
    var c = document.createElement("canvas"); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);

  }).catch(function(){ return file; });
}

function summary(days){
  var d = loadDiary(), set = {}; days.forEach(function(k){ set[k] = 1; });
  var food = d.food.filter(function(f){ return set[f.day]; });
  var rec = days.filter(function(k){ return d.days[k] && d.days[k].pain != null; });
  var pains = rec.map(function(k){ return d.days[k].pain; });
  var counts = {};
  food.forEach(function(f){ (f.labels || []).forEach(function(x){ counts[x.l] = (counts[x.l] || 0) + 1; }); });
  var top = Object.keys(counts).sort(function(a, b){ return counts[b] - counts[a]; }).slice(0, 5).map(function(l){ return [l, counts[l]]; });
  return {
    d: d, food: food, rec: rec,
    avg: pains.length ? pains.reduce(function(a, b){ return a + b; }, 0) / pains.length : null,
    max: pains.length ? Math.max.apply(null, pains) : null,
    flares: days.filter(function(k){ return d.days[k] && d.days[k].flare; }),
    uric: days.filter(function(k){ return d.days[k] && d.days[k].uric != null; }).map(function(k){ return [k, d.days[k].uric]; }),
    notes: days.filter(function(k){ return d.days[k] && d.days[k].note; }).map(function(k){ return [k, d.days[k].note]; }),
    red: food.filter(function(f){ return f.verdict === "red"; }),
    top: top
  };
}
// Pain per day as bars on one 0–10 scale; flare days marked with a dot; tap a day for its details.
function chartSvg(days, d){
  var W = 320, H = 132, left = 18, right = 4, top = 14, bottom = 20, ph = H - top - bottom;
  var step = (W - left - right) / days.length, bw = Math.max(3, step - 2.5);
  var y = function(v){ return top + ph - (v / 10) * ph; };
  var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(T("histTitle")) + '">';
  [0, 5, 10].forEach(function(v){ s += '<line class="grid" x1="' + left + '" x2="' + (W - right) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text x="' + (left - 4) + '" y="' + (y(v) + 3) + '" text-anchor="end">' + v + '</text>'; });
  days.forEach(function(k, i){
    var x = left + i * step + (step - bw) / 2, day = d.days[k];
    if (day && day.pain != null){
      var h = Math.max(2, (day.pain / 10) * ph), yy = top + ph - h, rr = Math.min(3, bw / 2);
      s += '<path class="bar" data-bar="' + i + '" d="M' + x + ' ' + (top + ph) + 'V' + (yy + rr) + 'Q' + x + ' ' + yy + ' ' + (x + rr) + ' ' + yy + 'H' + (x + bw - rr) + 'Q' + (x + bw) + ' ' + yy + ' ' + (x + bw) + ' ' + (yy + rr) + 'V' + (top + ph) + 'Z"/>';
      if (day.flare) s += '<circle class="flare" cx="' + (x + bw / 2) + '" cy="' + Math.max(6, yy - 6) + '" r="4"/>';
    } else {
      s += '<rect class="nodata" x="' + x + '" y="' + (top + ph - 2) + '" width="' + bw + '" height="2" rx="1"/>';
    }
    s += '<rect class="hit" data-i="' + i + '" x="' + (left + i * step) + '" y="0" width="' + step + '" height="' + H + '"/>';
  });
  [0, Math.floor(days.length / 2), days.length - 1].forEach(function(i){
    var anc = i === 0 ? "start" : i === days.length - 1 ? "end" : "middle", tx = i === 0 ? left + i * step : i === days.length - 1 ? left + (i + 1) * step : left + i * step + step / 2;
    s += '<text x="' + tx + '" y="' + (H - 5) + '" text-anchor="' + anc + '">' + fmtDay(days[i]) + '</text>';
  });
  return s + '</svg>';
}

  var days = lastDays(30), S = summary(days), el = $("tabHistory");
  if (!S.rec.length && !S.food.length){

    '<span class="label">' + T("histTitle") + '</span>' + chartSvg(days, S.d) +

  el.querySelector(".chart").addEventListener("click", function(e){

    $("chartTip").textContent = day && day.pain != null ? T("dayDetail", { d: fmtDay(k), p: day.pain, f: day.flare ? T("flareMark") : "", n: n }) + (day.note ? " – " + day.note : "") : T("dayNone", { d: fmtDay(k) });
  });
}

// Demo build only: a plausible month so the history and report have something to show.
function loadDemoDiary(){
  var d = { food:[], days:{} }, days = lastDays(30), seed = 7;
  var rnd = function(){ seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  var items = [["Gemüsebrühe", "red", [["Hefeextrakt", "red"]]], ["Cola", "red", [["Zuckerhaltiges Getränk", "red"]]], ["Salami", "yellow", [["Rotes oder verarbeitetes Fleisch", "yellow"]]],
               ["Naturjoghurt 1,5 %", "green", []], ["Mineralwasser", "green", []], ["Weißbier alkoholfrei", "yellow", [["Bier", "yellow"]]], ["Haferflocken", "green", []]];
  days.forEach(function(k, i){
    if (rnd() < 0.15) return;
    var flare = i > 15 && i < 19;
    d.days[k] = { pain: flare ? 6 + Math.round(rnd() * 3) : Math.round(1 + rnd() * 3), flare: flare, uric: i % 10 === 0 ? Math.round((5.8 + rnd() * 2) * 10) / 10 : null, note: i === 16 ? "Großzehe geschwollen" : "" };
    var n = 1 + Math.floor(rnd() * 3);
    for (var j = 0; j < n; j++){ var it = items[Math.floor(rnd() * items.length)]; d.food.push({ day:k, t: Date.now() - (29 - i) * 864e5 + j, name: it[0], code:null, verdict: it[1], labels: it[2].map(function(x){ return { l:x[0], s:x[1] }; }) }); }
  });
  saveDiary(d);
}

function reportData(){
  var days = lastDays(30), S = summary(days), L = function(v){ return RheumaEngine.loc(v, settings.lang); };
  var eff = effFlags(), flagTxt = allFlags().filter(function(f){ return eff[f.id]; }).map(function(f){ return L(f.label); });
  var tr = settings.triggers || {}, trigTxt = TRIGGERS.presets.filter(function(p){ return (tr.presets || {})[p.id]; }).map(function(p){ return L(p.label); })
    .concat((tr.custom || []).map(function(c){ return c.term; }));
  return { days: days, S: S, conds: activeSets().map(function(rs){ return L(rs.name); }).join(", "), flags: flagTxt, trig: trigTxt };
}
function reportHtml(R2){
  var S = R2.S, none = '<p>' + T("repNone") + '</p>';
  var rows = function(list, a, b){ return list.length ? '<div class="tbl"><table><tr><th>' + a + '</th><th>' + b + '</th></tr>' + list.map(function(x){ return '<tr><td>' + esc(x[0]) + '</td><td>' + esc(x[1]) + '</td></tr>'; }).join("") + '</table></div>' : none; };
  return '<div class="report"><h3>' + T("repTitle") + '</h3>' +
    '<p><b>' + T("repPeriod") + ':</b> ' + fmtDay(R2.days[0]) + ' – ' + fmtDay(R2.days[R2.days.length - 1]) + '<br><b>' + T("repProfile") + ':</b> ' + esc(R2.conds) +
    (R2.flags.length ? '<br><b>' + T("repSettings") + ':</b> ' + esc(R2.flags.join(", ")) : '') + (R2.trig.length ? '<br><b>' + T("repTriggers") + ':</b> ' + esc(R2.trig.join(", ")) : '') + '</p>' +
    '<h3>' + T("repPain") + '</h3><p>' + (S.avg == null ? T("repNone") : T("repAvg", { a: fmt(S.avg), m: S.max, n: S.rec.length === 1 ? T("days1") : T("daysN", { n: S.rec.length }) })) + '</p>' +
    '<h3>' + T("repFlares") + '</h3><p>' + (S.flares.length ? S.flares.map(function(k){ return fmtDay(k); }).join(", ") : T("repNone")) + '</p>' +
    (S.uric.length ? '<h3>' + T("repUric") + '</h3>' + rows(S.uric.map(function(x){ return [fmtDay(x[0]), fmt(x[1]) + " mg/dl"]; }), T("repDate"), T("repValue")) : '') +
    '<h3>' + T("repWarn") + '</h3>' + (S.top.length ? rows(S.top.map(function(x){ return [x[0], x[1] + "×"]; }), T("repReason"), "") : none) +
    '<h3>' + T("repRed") + '</h3>' + rows(S.red.map(function(f){ return [fmtDay(f.day) + " · " + f.name, (f.labels || []).map(function(x){ return x.l; }).join(", ")]; }), T("repProduct"), T("repReason")) +
    '<h3>' + T("repNotes") + '</h3>' + rows(S.notes.map(function(x){ return [fmtDay(x[0]), x[1]]; }), T("repDate"), T("note")) +
    '<p class="note">' + T("repDisclaimer") + '</p></div>';
}
function reportText(R2){
  var S = R2.S, lines = [T("repTitle"), T("repPeriod") + ": " + fmtDay(R2.days[0]) + " – " + fmtDay(R2.days[R2.days.length - 1]), T("repProfile") + ": " + R2.conds];
  if (R2.flags.length) lines.push(T("repSettings") + ": " + R2.flags.join(", "));
  if (R2.trig.length) lines.push(T("repTriggers") + ": " + R2.trig.join(", "));
  lines.push("", T("repPain") + ": " + (S.avg == null ? T("repNone") : T("repAvg", { a: fmt(S.avg), m: S.max, n: S.rec.length === 1 ? T("days1") : T("daysN", { n: S.rec.length }) })));
  lines.push(T("repFlares") + ": " + (S.flares.length ? S.flares.map(function(k){ return fmtDay(k); }).join(", ") : T("repNone")));
  if (S.uric.length) lines.push(T("repUric") + ": " + S.uric.map(function(x){ return fmtDay(x[0]) + " " + fmt(x[1]) + " mg/dl"; }).join("; "));
  lines.push(T("repWarn") + ": " + (S.top.length ? S.top.map(function(x){ return x[0] + " (" + x[1] + "×)"; }).join(", ") : T("repNone")));
  lines.push(T("repRed") + ": " + (S.red.length ? S.red.map(function(f){ return fmtDay(f.day) + " " + f.name; }).join("; ") : T("repNone")));
  if (S.notes.length) lines.push(T("repNotes") + ": " + S.notes.map(function(x){ return fmtDay(x[0]) + " " + x[1]; }).join("; "));
  lines.push("", T("repDisclaimer"));
  return lines.join("\n");
}
